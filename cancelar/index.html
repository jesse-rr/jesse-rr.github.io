<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cancelar Inscrição</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      max-width: 420px;
      width: 90%;
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #1a237e, #283593);
      padding: 32px 24px;
      text-align: center;
      color: #fff;
    }
    .header h1 { font-size: 20px; margin-bottom: 6px; }
    .header p { font-size: 13px; color: #bbdefb; }
    .body { padding: 32px 24px; }
    .body label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 6px;
    }
    .body input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
      transition: border .2s;
    }
    .body input:focus { border-color: #1a73e8; }
    .body button {
      margin-top: 16px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #d32f2f;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s;
    }
    .body button:hover { background: #b71c1c; }
    .msg {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
      display: none;
    }
    .msg.ok { display: block; background: #e8f5e9; color: #2e7d32; }
    .msg.err { display: block; background: #fbe9e7; color: #c62828; }
    .footer {
      padding: 16px;
      text-align: center;
      border-top: 1px solid #eee;
    }
    .footer a { color: #1a73e8; font-size: 13px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>Cancelar Inscrição</h1>
      <p>Notificações de Concursos de TI — SC</p>
    </div>
    <div class="body">
      <label for="email">Seu e-mail</label>
      <input type="email" id="email" placeholder="seuemail@exemplo.com" required>
      <button id="btn">Cancelar Inscrição</button>
      <div id="msg"></div>
    </div>
    <div class="footer">
      <a href="/">← Voltar ao site</a>
    </div>
  </div>

  <script>
    document.getElementById("btn").addEventListener("click", function () {
      var email = document.getElementById("email").value.trim();
      var msg = document.getElementById("msg");
      if (!email || !email.includes("@")) {
        msg.className = "msg err";
        msg.textContent = "Por favor, insira um e-mail válido.";
        return;
      }
      fetch("https://formsubmit.co/ajax/jesse.rampazzo@gmail.com", {
        method: "POST",
        headers: { "Content-Type": "application/json", Accept: "application/json" },
        body: JSON.stringify({
          email: email,
          _subject: "Cancelar inscrição - Concursos TI",
          message: email + " solicitou cancelamento das notificações de concursos."
        })
      })
        .then(function (r) { return r.json(); })
        .then(function () {
          msg.className = "msg ok";
          msg.textContent = "✅ Solicitação enviada! Você será removido em breve.";
          document.getElementById("email").value = "";
        })
        .catch(function () {
          msg.className = "msg err";
          msg.textContent = "Erro ao enviar. Tente novamente.";
        });
    });
  </script>
</body>
</html>
